<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Login | LifeLink</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); min-height: 100vh; display: flex; align-items: center;">

    <div class="container">
        <div class="form-container card" style="max-width: 400px; margin: 0 auto;">
            <div style="text-align: center; margin-bottom: 30px;">
                <a href="index.html" class="logo" style="font-size: 2rem;">LifeLink<span>+</span></a>
                <p style="color: var(--text-light);">Hospital Management Portal</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="hospital1" required>
                </div>
                <div class="form-group" style="position: relative;">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••" required>
                    <small id="togglePass" style="position: absolute; right: 10px; top: 40px; cursor: pointer; color: var(--primary);">Show</small>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
            </form>

            <div style="margin-top: 25px; padding: 15px; background: #f8fafc; border-radius: 8px; font-size: 0.9rem;">
                <p><strong>Demo Credentials:</strong></p>
                <p>User: hospital1 / Pass: 123456</p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
