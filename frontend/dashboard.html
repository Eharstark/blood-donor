<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Dashboard | LifeLink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#f1f5f9;">

<div class="container" style="padding-top:40px;">

```
<div class="card">
    <h2>Hospital Donor Search</h2>

    <div class="grid-4" style="grid-template-columns: 1fr 1fr auto; gap:15px; margin-top:20px;">

        <select id="searchBlood">
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>

        <input
            type="text"
            id="searchCity"
            placeholder="Enter City">

        <button
            class="btn btn-primary"
            onclick="searchDonors()">
            Search
        </button>

    </div>
</div>

<div class="card" style="margin-top:30px;">
    <h3>Matching Donors</h3>

    <table style="width:100%; margin-top:20px;">
        <thead>
            <tr>
                <th>Name</th>
                <th>Blood Group</th>
                <th>Location</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="donorTableBody">
            <tr>
                <td colspan="6" style="text-align:center;">
                    Search for donors to see results
                </td>
            </tr>
        </tbody>

    </table>
</div>
```

</div>

<script src="search.js"></script>

</body>
</html>
