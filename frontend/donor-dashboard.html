<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donor Dashboard | LifeLink</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f1f5f9;">
    <div class="container" style="padding-top: 40px;">
        <div style="display: grid; grid-template-columns: 350px 1fr; gap: 30px;">
            
            <aside>
                <div class="card" style="text-align: center;">
                    <div style="width: 100px; height: 100px; background: #e2e8f0; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">👤</div>
                    <h2 id="donorName">John Doe</h2>
                    <p style="color: var(--primary); font-weight: 700; font-size: 1.5rem; margin: 10px 0;">O Positive (O+)</p>
                    <hr style="margin: 20px 0; opacity: 0.1;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Status:</span>
                        <span id="statusLabel" class="status-badge status-available">Available</span>
                    </div>
                    <button id="toggleBtn" class="btn btn-outline" style="width: 100%;">Toggle Availability</button>
                </div>
            </aside>

            <main>
                <div class="grid-4" style="grid-template-columns: 1fr 1fr; margin-bottom: 30px;">
                    <div class="card">
                        <h3>12</h3>
                        <p>Total Donations</p>
                    </div>
                    <div class="card">
                        <h3>Oct 12, 2023</h3>
                        <p>Last Donation</p>
                    </div>
                </div>

                <div class="card">
                    <h3>Emergency Notifications</h3>
                    <div id="notifications" style="margin-top: 20px;">
                        <!-- JS injected -->
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="js/donor.js"></script>
</body>
</html>
