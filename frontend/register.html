<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | LifeLink Donor</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">LifeLink<span>+</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html" class="active">Register</a></li>
                <li><a href="hospital-login.html" class="nav-btn">Hospital Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="form-container card">
            <h2 style="margin-bottom: 25px;">Donor Registration</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your name" required>
                </div>
                <div class="grid-4" style="grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="age" min="18" required>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender">
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Blood Group</label>
                    <select id="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option>A+</option><option>A-</option>
                        <option>B+</option><option>B-</option>
                        <option>AB+</option><option>AB-</option>
                        <option>O+</option><option>O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="phone" placeholder="10-digit number" required>
                </div>
                <div class="grid-4" style="grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label>Area</label>
                        <input type="text" id="area" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Last Donation Date</label>
                    <input type="date" id="lastDonation">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register as Donor</button>
            </form>
        </div>
    </div>

    <div id="toast" style="display:none; position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 15px 30px; border-radius: 8px; box-shadow: var(--shadow);">
        Registration Successful! Redirecting...
    </div>

    <script src="register.js"></script>
</body>
</html>
